
<div class="signup-container">
  <div class="signup-left">
    <img src="https://raw.githubusercontent.com/diegooo01/HidraNet/refs/heads/main/public/brand-logo/art-collab-logo.png" alt="ArtCollab Logo" class="logo" />
  </div>
  <div class="signup-right">
    <form [formGroup]="form">
      <div class="login-box">
        <h2>Registrarse</h2>

        <!-- Paso 1: Datos básicos -->
        <div *ngIf="step === 1">
          <div class="form-row">
            <div class="form-group">
              <input type="text" placeholder="Usuario*" formControlName="username" required />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <input type="text" placeholder="Nombres*" formControlName="nombres" required />
            </div>
            <div class="form-group">
              <input type="text" placeholder="Apellidos*" formControlName="apellidos" required />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <input [type]="showPassword ? 'text' : 'password'" placeholder="Contraseña*" formControlName="password" />
              <span class="material-symbols-outlined icon" (click)="togglePasswordVisibility()">
                {{ showPassword ? 'visibility_off' : 'visibility' }}
              </span>
            </div>
          </div>
          <div class="redirect-link">
            ¿Ya tienes una cuenta? <a routerLink="/login">Inicia sesión</a>
          </div>
          <button class="login-button" type="button" (click)="goToNextStep()">Siguiente</button>
        </div>

        <!-- Paso 2: Ubicación -->
        <div *ngIf="step === 2">
          <div class="form-row">
            <div class="form-group">
              <input type="text" placeholder="Ubicación*" formControlName="ubicacion" required />
            </div>
          </div>
          <button class="login-button" type="button" (click)="goToNextStep()">Siguiente</button>
        </div>

        <!-- Paso 3: Información de contacto -->
        <div *ngIf="step === 3">
          <div class="form-row">
            <div class="form-group">
              <input type="tel" placeholder="Teléfono*" formControlName="telefono" required />
            </div>
            <div class="form-group">
              <input type="date" placeholder="Fecha de nacimiento*" formControlName="fechaNacimiento" required />
            </div>
          </div>
            <div class="form-row">
              <div class="form-group">
                <label for="photo-upload" class="file-upload-label">
                  <span class="material-symbols-outlined">add_photo_alternate</span>
                  <span>{{ selectedFileName || 'Seleccionar foto de perfil (opcional)' }}</span>
                </label>
                <input 
                  type="file" 
                  id="photo-upload" 
                  accept="image/*" 
                  (change)="onFileSelected($event)"
                  style="display: none;"
                />
              </div>
            </div>
          <button class="login-button" type="button" (click)="goToNextStep()">Siguiente</button>
        </div>

        <!-- Paso 4: Redes sociales y descripción -->
        <div *ngIf="step === 4">
          <!-- Descripción -->
          <div class="form-group full-width">
            <textarea rows="4" placeholder="Descripción" formControlName="descripcion" class="description-input"></textarea>
          </div>

          <!-- Redes Sociales Simplificadas -->
          <div class="form-group full-width">
            <div class="social-networks-section">
              <h3>Redes sociales (Opcional)</h3>
              <div class="form-group">
                <input type="url" placeholder="Instagram" formControlName="additionalProp1" />
              </div>
              <div class="form-group">
                <input type="url" placeholder="Twitter" formControlName="additionalProp2" />
              </div>
              <div class="form-group">
                <input type="url" placeholder="LinkedIn" formControlName="additionalProp3" />
              </div>
            </div>
          </div>

          <button class="login-button" type="button" (click)="onSubmitFinal()">Finalizar Registro</button>
        </div>
      </div>
    </form>
  </div>
</div>
