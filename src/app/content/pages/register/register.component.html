<div class="login-page">
  <div class="logo-container">
    <img
      src="https://raw.githubusercontent.com/diegooo01/HidraNet/refs/heads/main/public/brand-logo/art-collab-logo.png"
      alt="ArtCollab Logo"
      class="logo"
    />
  </div>

  <div class="login-box">
    <h2>Registrarse</h2>

    <div class="role-selector">
      <p>¿Escritor o Ilustrador?</p>
      <div class="roles">
        <label>
          <input type="radio" name="role" [(ngModel)]="selectedRole" [value]="1" />
          <span>Escritor</span>
        </label>
        <label>
          <input type="radio" name="role" [(ngModel)]="selectedRole" [value]="2" />
          <span>Ilustrador</span>
        </label>
      </div>
    </div>

    <div class="form-group">
      <input type="text" placeholder="Usuario*" [(ngModel)]="username" />
    </div>

    <div class="form-group">
      <input type="text" placeholder="Nombres*" [(ngModel)]="nombres" />
    </div>

    <div class="form-group">
      <input type="text" placeholder="Apellidos*" [(ngModel)]="apellidos" />
    </div>

    <div class="form-group">
      <input type="text" placeholder="Ubicación*" [(ngModel)]="ubicacion" />
    </div>

    <div class="form-group">
      <input type="tel" placeholder="Teléfono*" [(ngModel)]="telefono" />
    </div>

    <div class="form-group">
      <input type="date" placeholder="Fecha de nacimiento*" [(ngModel)]="fechaNacimiento" />
    </div>

    <div class="form-group">
      <input type="text" placeholder="URL de foto (opcional)" [(ngModel)]="foto" />
    </div>

    <div class="form-group">
      <textarea placeholder="Descripción" [(ngModel)]="descripcion" rows="3"></textarea>
    </div>

    <div class="form-group">
      <input
        [type]="showPassword ? 'text' : 'password'"
        placeholder="Contraseña*"
        [(ngModel)]="password"
      />
      <span class="material-symbols-outlined icon" (click)="togglePasswordVisibility()">
        {{ showPassword ? 'visibility_off' : 'visibility' }}
      </span>
    </div>

    <!-- Sección de redes sociales opcionales -->
    <div class="social-section">
      <h3>Redes Sociales (Opcional)</h3>
      <div class="form-group">
        <input type="text" placeholder="Instagram" [(ngModel)]="redesSociales.additionalProp1" />
      </div>
      <div class="form-group">
        <input type="text" placeholder="Twitter" [(ngModel)]="redesSociales.additionalProp2" />
      </div>
      <div class="form-group">
        <input type="text" placeholder="LinkedIn" [(ngModel)]="redesSociales.additionalProp3" />
      </div>
    </div>

    <div class="redirect-link">
      ¿Ya tienes una cuenta? <a routerLink="/login">Inicia sesión</a>
    </div>

    <button class="login-button" (click)="onRegister()">Registrar</button>
  </div>
</div>
