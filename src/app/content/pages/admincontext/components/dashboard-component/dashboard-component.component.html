<app-sidebar-component></app-sidebar-component>
<div>
  <div class="container">
    <mat-card class="card">
      <mat-card-title class = "header-row">Admin - Dashboard</mat-card-title>

      <div *ngIf="loading">Cargando...</div>
      <div *ngIf="error" class="error">{{ error }}</div>

      <mat-card-actions class ="action-buttons">
        <button mat-button class="btn" routerLink="/admin/dashboard">Ver Usuarios</button>
        <button mat-button class="btn" routerLink="/admin/users/new">Crear Usuarios</button>
      </mat-card-actions>

      <mat-card-content *ngIf="users?.length">
        <h3>Usuarios registrados</h3>
        <table mat-table [dataSource]="users" class="mat-elevation-z8">

          <!-- Nombre -->
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Nombre</th>
            <td mat-cell *matCellDef="let d">{{ d.name }}</td>
          </ng-container>

          <!-- Email de contacto -->
          <ng-container matColumnDef="contactEmail">
            <th mat-header-cell *matHeaderCellDef>Email</th>
            <td mat-cell *matCellDef="let d">{{ d.email }}</td>
          </ng-container>

          <!-- Role -->
          <ng-container matColumnDef="role">
            <th mat-header-cell *matHeaderCellDef>Rol</th>
            <td mat-cell *matCellDef="let d">{{ d.role }}</td>
          </ng-container>

          <!-- Portfolio -->
          <ng-container matColumnDef="portfolio">
            <th mat-header-cell *matHeaderCellDef>Portfolio</th>
            <td mat-cell *matCellDef="let u">
              <ng-container *ngIf="u.portfolio?.length">
                <mat-nav-list>
                  <a mat-list-item *ngFor="let p of u.portfolio">
                    <div matLine>{{ p.title }}</div>
                  </a>
                </mat-nav-list>
              </ng-container>
            </td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Acciones</th>
            <td mat-cell *matCellDef="let u">
              <button mat-icon-button color="warn" (click)="confirmDelete(u)" aria-label="Eliminar usuario">
                <mat-icon>X</mat-icon>
              </button>
            </td>

          </ng-container>

          <tr mat-header-row *matHeaderRowDef="['name', 'contactEmail', 'role', 'portfolio', 'actions']"></tr>
          <tr mat-row *matRowDef="let row; columns: ['name', 'contactEmail', 'role', 'portfolio', 'actions'];"></tr>
        </table>
      </mat-card-content>
    </mat-card>
  </div>
  <!-- Cards Users -->
  <h2 class="cards-title">Perfiles de usuarios</h2>
  <div class="cards-container">
    <div class="card" *ngFor="let user of users">
      <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" class="avatar" alt="avatar">
      <h3>{{ user.name }}</h3>
      <p>{{ user.email }}</p>
      <p><strong>Rol:</strong> {{ user.role }}</p>
      <p><strong>Estado:</strong> {{ user.status }}</p>

      <div class="card-actions">
        <mat-form-field appearance="fill" class="status-select">
          <mat-label>Estado</mat-label>
          <mat-select [value]="user.status"
                      (selectionChange)="changeStatus(user, $event.value)"
                      aria-label="Seleccionar estado">
            <mat-option value="active">Activo</mat-option>
            <mat-option value="suspended">Suspendido</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
    </div>
  </div>
</div>
