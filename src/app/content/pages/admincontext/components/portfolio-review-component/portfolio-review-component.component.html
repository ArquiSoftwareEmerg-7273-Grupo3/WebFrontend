<app-sidebar-component></app-sidebar-component>
<div class="container">
  <mat-card class="card">
  <h2>Revisión de Portafolios</h2>
  <div *ngIf="loading">Cargando...</div>

  <div *ngIf="!loading && portfolios.length" class="portfolio-grid">
    <mat-card *ngFor="let p of portfolios" class="portfolio-card" role="article">
      <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" class="avatar" alt="avatar">
      <mat-card-header>
        <mat-card-title>{{ p.title }}</mat-card-title>
        <mat-card-subtitle>{{ p.userId }}</mat-card-subtitle>
      </mat-card-header>

      <mat-card-content>
        <p>{{ p.description }}</p>
        <div class="items">
          <img *ngFor="let it of p.items" mat-card-image [src]="it.imageUrl" [alt]="it.title" />
        </div>
      </mat-card-content>

      <mat-card-actions>
        <button mat-button color="primary" (click)="flag(p)">Marcar</button>
        <button mat-button color="warn" (click)="remove(p)">Eliminar</button>
      </mat-card-actions>
    </mat-card>
  </div>

  <div *ngIf="!loading && !portfolios.length">No hay portafolios para revisar.</div>
  </mat-card>
</div>
