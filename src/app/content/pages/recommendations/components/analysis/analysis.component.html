<div class="rec-analysis-page">
  <div class="rec-analysis-container">
    <header class="rec-analysis-header">
      <h1>Análisis de proyectos</h1>
      <p>Revisa los proyectos analizados por la IA y ve los postulantes recomendados.</p>
    </header>

    <div *ngIf="isLoading" class="loading-state">
      <p>Cargando análisis desde el servidor...</p>
    </div>

    <div *ngIf="errorMessage" class="error-msg">
      {{ errorMessage }}
    </div>

    <section class="rec-analysis-list" *ngIf="!isLoading && !errorMessage">

      <article class="rec-analysis-card" *ngFor="let item of projects">
        <div class="rec-analysis-thumb">
          <img
            [src]="'https://images.pexels.com/photos/1989783/pexels-photo-1989783.jpeg?auto=compress&w=300'"
            [alt]="item.project_titulo"
          />
        </div>

        <div class="rec-analysis-body">
          <div class="rec-analysis-top">
            <h2>{{ item.project_titulo }}</h2>
            <div class="rec-analysis-tags">
              <span class="rec-chip-status done">Análisis terminado</span>
              <span class="rec-chip-type">ID: {{ item.project_id }}</span>
            </div>
          </div>

          <div class="rec-analysis-bottom">
            <p class="rec-analysis-date">
              <span class="material-symbols-outlined">group</span>
              {{ item.recommended_artists.length }} artistas encontrados
            </p>
            <button
              type="button"
              class="rec-analysis-btn"
              [routerLink]="['/recommendations/analysis', item.project_id, 'applicants']"
            >
              Ver postulantes recomendados
              <span class="material-symbols-outlined">chevron_right</span>
            </button>
          </div>
        </div>
      </article>

    </section>
  </div>
</div>
