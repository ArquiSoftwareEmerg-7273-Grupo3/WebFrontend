<div class="portfolio-container">
  <div class="content-wrapper">
    <button class="back-button" (click)="goBack()">
      <span class="material-symbols-outlined">arrow_back</span>
    </button>

    <!-- Summary Panel -->
    <div class="summary-panel">
      <div class="avatar">
        <div class="image-wrapper large-hero">
          <img [src]="portfolio.urlImagen || 'assets/placeholder.png'" alt="Portfolio image" loading="lazy" />
        </div>
      </div>
      <h1 class="title">{{ portfolio.titulo}}</h1>
      <h4 class="description">{{ portfolio.descripcion}}</h4>
    </div>

    <!-- Gallery Section -->
    <div class="gallery">
      <div class="gallery-grid">
        <div class="gallery-card" *ngFor="let item of portfolio.galleryItems">
          <div class="rating">☆☆☆☆☆</div>
          <div class="image-wrapper gallery-item">
            <img [ngSrc]="item.urlImagen || 'assets/placeholder.png'" [alt]="item.title" loading="lazy" />
          </div>
          <div class="item-title">{{ item.title }}</div>
        </div>
      </div>
    </div>

    <button class="floating-button" (click)="goToCreateIllustration()">
      <span class="material-symbols-outlined">add</span>
    </button>
  </div>
</div>
