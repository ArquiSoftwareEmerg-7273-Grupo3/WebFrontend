<div class="dialog" (click)="onDialogClick($event)">
  <!-- Cerrar -->
  <button class="close-btn" type="button" (click)="close()">✕</button>

  <!-- Título -->
  <h2 class="dialog-title">Editar portafolio</h2>

  <div class="content">
    <!-- Lado izquierdo: formulario visual -->
    <div class="form">
      <label class="field-label">Título</label>
      <input type="text" class="input" [(ngModel)]="title" name="title" />

      <label class="field-label">Descripción</label>
      <textarea class="textarea" rows="4" [(ngModel)]="description" name="description"></textarea>

      <label class="field-label">Categoría</label>
      <div class="select-wrapper">
        <select class="select" [(ngModel)]="category" name="category">
          <option *ngFor="let c of categories" [value]="c">{{ c }}</option>
        </select>
        <span class="select-arrow">⌄</span>
      </div>

      <div class="actions">
        <button class="btn-secondary" type="button" (click)="close()">Cancelar</button>
        <button class="btn-primary" type="button" (click)="guardarVisual()">Guardar cambios</button>
      </div>
    </div>

    <!-- Lado derecho: foto -->
    <div class="cover-wrapper">
      <div class="cover-circle">
        <img *ngIf="previewCoverUrl" [src]="previewCoverUrl" alt="Portada" class="cover-img" />
      </div>

      <button type="button" class="change-cover-btn" (click)="onChangeCoverClick(fileInput)">
        Cambiar foto<br />del portafolio
      </button>

      <input #fileInput type="file" accept="image/*" class="hidden-file" (change)="onCoverSelected($event)" />
    </div>
  </div>
</div>
