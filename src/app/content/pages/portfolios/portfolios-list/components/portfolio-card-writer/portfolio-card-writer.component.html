<div class="card" role="article">
  <div class="image-wrapper">
    <img [ngSrc]="urlImagen" [alt]="titulo || 'Portafolio'" />
  </div>

  <div class="info">
    <h2 class="title">{{ titulo }}</h2>

    <div class="spacer"></div>

    <div class="footer">
      <button class="view-more" (click)="viewMore()">Ver más</button>
    </div>
  </div>
</div>
