<div class="options-icon" *ngIf="visible"
     (click)="stop($event)"
     [ngStyle]="{ left: left + 'px', top: top + 'px' }">
  
  <!-- User info header -->
  <div class="user-info-header">
    <div class="user-name-container">
      <span class="user-name">{{ userName }}</span>
      <app-premium-badge [isPremium]="isPremium" size="small"></app-premium-badge>
    </div>
    <span class="user-email">{{ userEmail }}</span>
  </div>

  <div class="divider"></div>

  <button class="options-item" (click)="navigate('/profile')">
    <span class="material-symbols-outlined">person</span> Ver perfil
  </button>
  <button class="options-item" (click)="navigate('/settings/plans')">
    <span class="material-symbols-outlined">settings</span> Ajustes
  </button>
  <button class="options-item" (click)="logout()">
    <span class="material-symbols-outlined">logout</span> Cerrar sesión
  </button>
</div>
